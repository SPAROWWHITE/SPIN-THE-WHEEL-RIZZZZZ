<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elimination Wheel</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #f5e0dc;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      margin-top: 20px;
    }

    .controls {
      background: #313244;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      width: 280px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #181825;
      color: #a6adc8;
      border: 1px solid #45475a;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-update {
      background: #89b4fa;
      color: #11111b;
    }

    .btn-spin {
      background: #a6e3a1;
      color: #11111b;
      font-size: 18px;
    }

    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
    }

    /* Pointer at the top */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #f38ba8;
      z-index: 10;
    }

    canvas {
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #f9e2af;
      min-height: 30px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>Elimination Wheel</h1>

  <div class="container">

    <!-- Controls -->
    <div class="controls">

      <label for="namesInput">
        <b>Enter Names (one per line):</b>
      </label>

      <textarea id="namesInput">Harjot
Mohit
Rahul
Amit
Rohan
Taman
Gulshan</textarea>

      <button class="btn-update" onclick="resetWheel()">
        Set Names
      </button>

      <button class="btn-spin" id="spinBtn" onclick="spin()">
        SPIN!
      </button>

    </div>

    <!-- Wheel -->
    <div class="wheel-container">

      <div class="pointer"></div>

      <canvas id="wheel" width="360" height="360"></canvas>

    </div>

  </div>

  <div id="result"></div>


  <script>

    /*
      ==========================================
      PROTECTED NAMES
      ==========================================

      These two names will NOT be eliminated
      while other names are still available.

      They will remain until the FINAL TWO.
    */

    const PROTECTED_NAMES = [
      "TAMAN",
      "GULSHAN"
    ];


    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");

    let names = [];
    let currentAngle = 0;
    let isSpinning = false;


    // Wheel colors
    const colors = [
      "#f38ba8",
      "#fab387",
      "#f9e2af",
      "#a6e3a1",
      "#89b4fa",
      "#cba6f7",
      "#74c7ec"
    ];


    /*
      ==========================================
      SET NAMES
      ==========================================
    */

    function resetWheel() {

      if (isSpinning) return;

      const rawText =
        document.getElementById("namesInput").value;

      names = rawText
        .split("\n")
        .map(name => name.trim())
        .filter(name => name.length > 0);

      currentAngle = 0;

      document.getElementById("result").innerText = "";

      drawWheel();
    }


    /*
      ==========================================
      DRAW WHEEL
      ==========================================
    */

    function drawWheel() {

      const numSlices = names.length;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      const radius = centerX;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      if (numSlices === 0) return;


      const sliceAngle =
        (2 * Math.PI) / numSlices;


      for (let i = 0; i < numSlices; i++) {

        const startAngle =
          currentAngle + i * sliceAngle;

        const endAngle =
          startAngle + sliceAngle;


        // Draw slice
        ctx.beginPath();

        ctx.moveTo(
          centerX,
          centerY
        );

        ctx.arc(
          centerX,
          centerY,
          radius,
          startAngle,
          endAngle
        );

        ctx.closePath();

        ctx.fillStyle =
          colors[i % colors.length];

        ctx.fill();

        ctx.strokeStyle = "#11111b";
        ctx.lineWidth = 1;

        ctx.stroke();


        // Draw name
        ctx.save();

        ctx.translate(
          centerX,
          centerY
        );

        ctx.rotate(
          startAngle + sliceAngle / 2
        );

        ctx.textAlign = "right";

        ctx.fillStyle = "#11111b";

        ctx.font =
          "bold 16px sans-serif";

        ctx.fillText(
          names[i],
          radius - 20,
          5
        );

        ctx.restore();
      }
    }


    /*
      ==========================================
      SPIN
      ==========================================
    */

    function spin() {

      if (
        isSpinning ||
        names.length <= 1
      ) {
        return;
      }


      isSpinning = true;

      document.getElementById("result").innerText =
        "Spinning...";


      /*
        ========================================
        FIND NON-PROTECTED NAMES
        ========================================
      */

      const unprotectedIndices = names
        .map((name, index) => ({
          name: name.toUpperCase(),
          index: index
        }))
        .filter(item =>
          !PROTECTED_NAMES.includes(item.name)
        )
        .map(item => item.index);


      let availableIndices;


      /*
        ========================================
        ELIMINATION RULE

        If there are still other names:

        eliminate ONLY those names.

        Taman + Gulshan stay safe.
        ========================================
      */

      if (unprotectedIndices.length > 0) {

        availableIndices =
          unprotectedIndices;

      } else {

        /*
          Only Taman and Gulshan remain.

          Now choose randomly between them.
        */

        availableIndices =
          names.map((_, index) => index);
      }


      /*
        ========================================
        RANDOM TARGET
        ========================================
      */

      const targetIndex =
        availableIndices[
          Math.floor(
            Math.random() *
            availableIndices.length
          )
        ];


      /*
        ========================================
        CALCULATE ROTATION
        ========================================
      */

      const numSlices =
        names.length;

      const sliceAngle =
        (2 * Math.PI) / numSlices;


      // Pointer is at the top
      const pointerAngle =
        3 * Math.PI / 2;


      // Center of selected slice
      const targetSliceCenter =
        targetIndex * sliceAngle +
        sliceAngle / 2;


      let desiredAngle =
        pointerAngle -
        targetSliceCenter;


      /*
        Add 5 full rotations
        for a proper spin animation.
      */

      const fullSpins =
        5 * 2 * Math.PI;


      const baseAngle =
        currentAngle %
        (2 * Math.PI);


      let targetRotation =
        currentAngle +
        fullSpins +
        (desiredAngle - baseAngle);


      /*
        Make sure wheel always
        rotates forward.
      */

      if (
        targetRotation <
        currentAngle + fullSpins
      ) {

        targetRotation +=
          2 * Math.PI;
      }


      /*
        ========================================
        ANIMATION
        ========================================
      */

      const startTime =
        performance.now();

      const duration =
        4000;


      function animate(now) {

        const elapsed =
          now - startTime;


        const progress =
          Math.min(
            elapsed / duration,
            1
          );


        /*
          Ease-out cubic
        */

        const easeOut =
          1 -
          Math.pow(
            1 - progress,
            3
          );


        currentAngle =
          currentAngle +
          (
            targetRotation -
            currentAngle
          ) * (easeOut * 0.05);


        drawWheel();


        if (
          progress < 1 &&
          Math.abs(
            targetRotation -
            currentAngle
          ) > 0.001
        ) {

          requestAnimationFrame(
            animate
          );

        } else {

          /*
            ==================================
            SPIN FINISHED
            ==================================
          */

          currentAngle =
            targetRotation;

          drawWheel();

          isSpinning = false;


          /*
            Get eliminated name
          */

          const eliminatedName =
            names[targetIndex];


          /*
            Remove name
          */

          names.splice(
            targetIndex,
            1
          );


          /*
            Show result
          */

          document.getElementById(
            "result"
          ).innerText =
            `${eliminatedName} was eliminated!`;


          /*
            ==================================
            FINAL TWO
            ==================================
          */

          setTimeout(() => {

            drawWheel();


            if (names.length === 2) {

              document.getElementById(
                "result"
              ).innerText =
                `FINAL TWO: ${names.join(" vs ")}!`;

            }


            /*
              ==================================
              WINNER
              ==================================
            */

            if (names.length === 1) {

              document.getElementById(
                "result"
              ).innerText =
                `🏆 WINNER: ${names[0]}!`;

            }

          }, 1500);
        }
      }


      requestAnimationFrame(
        animate
      );
    }


    /*
      ==========================================
      INITIAL LOAD
      ==========================================
    */

    resetWheel();

  </script>

</body>
</html>
